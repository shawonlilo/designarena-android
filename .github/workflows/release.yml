name: Build & Publish Signed Release APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version (e.g., 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: Missing ANDROID_KEYSTORE_BASE64 secret." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Compute version metadata
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ github.event.inputs.version_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION_NAME="${TAG#v}"
          VERSION_CODE="${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Run unit tests & build signed release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: gradle testReleaseUnitTest assembleRelease

      - name: Package APK & SHA-256 checksum
        run: |
          mkdir -p dist
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APK_OUT="dist/designarena-${{ steps.version.outputs.tag }}.apk"
          cp "$APK_SRC" "$APK_OUT"
          (cd dist && sha256sum "$(basename "$APK_OUT")" > SHA256SUMS.txt)

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "DesignArena Android ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
